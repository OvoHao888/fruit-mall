# ==========================================================================
#  应用主配置
#
#  数据库口令 / 邮箱授权码 / 大模型 API Key 等私密配置一律不写在本文件里，
#  而是放在同目录下的 application-local.properties（已被 .gitignore 排除）。
#
#  首次运行：
#    1. 复制 application-local.properties.example 为 application-local.properties
#    2. 填入真实值
#  下面的 ${VAR:} 占位符会自动从该文件解析。
# ==========================================================================
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

spring.application.name=springboot
server.port=1234
server.servlet.context-path=/

# ---------------- 数据库 ----------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_mall?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-built-in-alias-types=true
mybatis-plus.mapper-locations=classpath:/mapper/*.xml

# ---------------- 缓存 ----------------
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# ---------------- 文件上传 ----------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

# ---------------- 邮件 ----------------
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=utf-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=465
# 关闭 SMTP 调试日志：debug 会打印完整会话（含认证过程），不适合留在默认配置里
spring.mail.properties.mail.debug=false
user.fromEmail=${MAIL_USERNAME:}

# ---------------- 业务参数 ----------------
# 新用户注册时的默认口令
user.defaultPassword=${USER_DEFAULT_PASSWORD:123456}

# ---------------- Spring AI（智能导购）----------------
spring.ai.openai.base-url=${AI_BASE_URL:https://api.siliconflow.cn}
spring.ai.openai.api-key=${AI_API_KEY:}
spring.ai.openai.chat.options.model=${AI_MODEL:deepseek-ai/DeepSeek-V3}
spring.ai.openai.chat.options.temperature=0.7

# ---------------- 其它 ----------------
spring.jackson.default-property-inclusion=non_empty
spring.security.user.name=${SECURITY_USER:admin}
spring.security.user.password=${SECURITY_PASSWORD:}
